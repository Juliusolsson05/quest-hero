<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quest Hero</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0b0e14; font: 14px/1.5 system-ui, sans-serif; color: #e6e6e6; }
      canvas { display: block; }

      /* Everything below is HUD painted over the canvas. Kept in plain DOM
         rather than rendered in 3D because dialogue is text-heavy and needs
         to stay readable and selectable. */
      #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; opacity: .6; pointer-events: none; }
      #prompt { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%);
        padding: 8px 14px; background: rgba(0,0,0,.65); border: 1px solid #2b3245;
        border-radius: 6px; opacity: 0; transition: opacity .15s; pointer-events: none; }
      #prompt.on { opacity: 1; }
      kbd { background: #2b3245; border-radius: 3px; padding: 1px 6px; font: inherit; }
      #start { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px;
        text-align: center; background: rgba(11,14,20,.92); cursor: pointer; z-index: 10; }
      #start h1 { font-size: 34px; letter-spacing: -.02em; }
      #start p { color: #8b94a8; }
      #start.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="start">
      <h1>Quest Hero</h1>
      <p>WASD to move &middot; mouse to look &middot; <kbd>E</kbd> to talk</p>
      <p style="color:#4c5570">Click to begin</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
